# Server configuration
server.port=${SERVER_PORT:8080}

# MySQL Database configuration (credentials supplied via environment variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:healthtrack}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings with consistent UTC handling
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson UTC serialization
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Manual SQL scripts (schema.sql / data.sql) are provided in resources;
# startup seeding is handled idempotently by SampleDataInitializer.
spring.sql.init.mode=never

# CORS configuration
healthtrack.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Seed demonstration records for PATIENT001 when none exist
healthtrack.seed.enabled=${HEALTHTRACK_SEED_ENABLED:true}

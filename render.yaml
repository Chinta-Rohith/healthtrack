services:
  - type: web
    name: healthtrack-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: healthtrack
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://healthtrack-nu-ten.vercel.app,http://localhost:5173
      - key: HEALTHTRACK_SEED_ENABLED
        value: "true"
